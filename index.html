<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>次郎の5大クイズダンジョン</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: radial-gradient(circle at center, #1e1b4b 0%, #090d16 100%);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 9:16 Portrait Container with Mobile Chrome Safe-Area Protection */
  #game-shell {
    position: relative;
    width: min(100vw, calc(100dvh * 9 / 16));
    height: min(100dvh, calc(100vw * 16 / 9));
    max-width: 100vw;
    max-height: 100dvh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    box-shadow: 0 0 50px rgba(0, 0, 0, 0.85), 0 0 0 2px rgba(255, 255, 255, 0.12);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border-radius: 14px;
  }

  @media (max-width: 520px) {
    #game-shell {
      width: 100vw;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
  }

  /* Keycap Badge for PC users */
  .keycap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(15, 23, 42, 0.85);
    color: #fde047;
    border: 1px solid rgba(253, 224, 71, 0.5);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
    margin-left: 4px;
    line-height: 1.2;
    vertical-align: middle;
  }

  /* Animations */
  @keyframes floatIdle {
    0%, 100% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-5px) scale(1.015); }
  }
  @keyframes bossAura {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(244, 63, 94, 0.65)); }
    50% { filter: drop-shadow(0 0 22px rgba(251, 191, 36, 0.9)); }
  }
  @keyframes shakeHard {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px) rotate(-1deg); }
    40% { transform: translateX(8px) rotate(1deg); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.88) translateY(12px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes flashPulse {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }

  .anim-idle { animation: floatIdle 3s ease-in-out infinite; }
  .anim-boss { animation: floatIdle 2.6s ease-in-out infinite, bossAura 2s ease-in-out infinite; }
  .anim-shake { animation: shakeHard 0.4s ease-in-out; }
  .anim-pop { animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

  .choice-btn {
    transition: transform 0.1s ease, background-color 0.15s ease, border-color 0.15s ease;
  }
  .choice-btn:active:not(:disabled) {
    transform: scale(0.97);
  }

  /* Custom subtle scrollbar for modal */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }
</style>
</head>
<body>

<div id="game-shell">
  <!-- Particle / Confetti Overlay Canvas -->
  <canvas id="fx-canvas" class="pointer-events-none absolute inset-0 z-50 w-full h-full"></canvas>
  <!-- Screen Flash Overlay -->
  <div id="flash-overlay" class="pointer-events-none absolute inset-0 z-40 bg-white opacity-0"></div>

  <!-- Top Utility Bar -->
  <header id="top-bar" class="relative z-30 flex items-center justify-between px-3 py-1.5 bg-slate-900/90 border-b border-slate-700/70 text-xs text-slate-200 shrink-0">
    <div class="flex items-center gap-1.5 font-extrabold text-amber-300 truncate">
      <span>👑 次郎の5大クイズダンジョン</span>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="btn-mute" onclick="AudioSys.toggleMute()" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[11px] font-bold flex items-center">
        <span id="mute-label">🔊 ON</span><span class="keycap">M</span>
      </button>
      <button id="btn-home" onclick="Game.confirmReturnHub()" class="hidden px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-600 text-[11px] font-bold">
        一覧へ<span class="keycap">Esc</span>
      </button>
    </div>
  </header>

  <!-- Main Dynamic Viewport -->
  <main id="screen-container" class="relative flex-1 w-full overflow-hidden flex flex-col"></main>

  <!-- Custom Modal (No alert/confirm!) -->
  <div id="modal-overlay" class="hidden absolute inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="w-full max-w-xs bg-slate-900 border-2 border-amber-400/70 rounded-2xl p-4 shadow-2xl anim-pop text-slate-100">
      <h3 id="modal-title" class="text-base font-black text-amber-300 mb-2">確認</h3>
      <p id="modal-body" class="text-xs leading-relaxed text-slate-200 mb-4"></p>
      <div id="modal-actions" class="flex gap-2 justify-end"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   1. PROCEDURAL WEB AUDIO ENGINE (BGM & SOUND EFFECTS)
============================================================================ */
const AudioSys = (() => {
  let ctx = null;
  let muted = false;
  let bgmTimer = null;
  let currentBgm = null;
  let step = 0;

  function init() {
    if (!ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) ctx = new AudioCtx();
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  function playTone(freq, duration, type = 'sine', vol = 0.08, delay = 0) {
    if (muted) return;
    init();
    if (!ctx) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(vol, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  const patterns = {
    hub: { tempo: 240, type: 'triangle', notes: [261.6, 329.6, 392.0, 523.3, 392.0, 329.6, 293.7, 392.0] },
    adv: { tempo: 320, type: 'sine', notes: [329.6, 392.0, 440.0, 392.0, 293.7, 349.2, 392.0, 261.6] },
    battle: { tempo: 155, type: 'square', notes: [220.0, 261.6, 329.6, 220.0, 246.9, 293.7, 349.2, 329.6] },
    boss: { tempo: 130, type: 'sawtooth', notes: [146.8, 146.8, 174.6, 164.8, 146.8, 220.0, 207.7, 196.0] }
  };

  function startBgm(name) {
    if (currentBgm === name && bgmTimer) return;
    stopBgm();
    currentBgm = name;
    step = 0;
    const p = patterns[name];
    if (!p) return;
    bgmTimer = setInterval(() => {
      if (muted) return;
      const note = p.notes[step % p.notes.length];
      playTone(note, (p.tempo / 1000) * 0.85, p.type, name === 'boss' ? 0.035 : 0.045);
      step++;
    }, p.tempo);
  }

  function stopBgm() {
    if (bgmTimer) {
      clearInterval(bgmTimer);
      bgmTimer = null;
    }
    currentBgm = null;
  }

  function se(kind) {
    if (muted) return;
    init();
    switch (kind) {
      case 'click':
        playTone(660, 0.07, 'triangle', 0.09);
        break;
      case 'blip':
        playTone(520 + Math.random() * 140, 0.035, 'sine', 0.04);
        break;
      case 'correct':
        playTone(523.25, 0.12, 'triangle', 0.12, 0);
        playTone(659.25, 0.12, 'triangle', 0.12, 0.08);
        playTone(783.99, 0.25, 'triangle', 0.14, 0.16);
        break;
      case 'wrong':
        playTone(185, 0.18, 'sawtooth', 0.11, 0);
        playTone(146.8, 0.3, 'sawtooth', 0.11, 0.14);
        break;
      case 'tick':
        playTone(880, 0.04, 'sine', 0.05);
        break;
      case 'start':
        [392, 493.9, 587.3, 784].forEach((f, i) => playTone(f, 0.14, 'square', 0.07, i * 0.06));
        break;
      case 'victory':
        [523.3, 659.3, 784, 1046.5].forEach((f, i) => playTone(f, 0.22, 'triangle', 0.12, i * 0.1));
        break;
      case 'defeat':
        [392, 349.2, 311.1, 261.6].forEach((f, i) => playTone(f, 0.26, 'sawtooth', 0.08, i * 0.15));
        break;
    }
  }

  function toggleMute() {
    muted = !muted;
    document.getElementById('mute-label').textContent = muted ? '🔇 OFF' : '🔊 ON';
    if (!muted) se('click');
  }

  return { init, startBgm, stopBgm, se, toggleMute };
})();

/* ============================================================================
   2. PARTICLE & FLASH FX ENGINE
============================================================================ */
const FX = (() => {
  const canvas = document.getElementById('fx-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let running = false;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resize);

  function spawn(x, y, count = 28, palette = ['#fde047', '#38bdf8', '#f472b6', '#4ade80']) {
    resize();
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 5.5;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1.5,
        size: 4 + Math.random() * 5,
        color: palette[Math.floor(Math.random() * palette.length)],
        alpha: 1,
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 0.2
      });
    }
    if (!running) loop();
  }

  function confetti() {
    resize();
    for (let i = 0; i < 65; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -10 - Math.random() * 120,
        vx: (Math.random() - 0.5) * 2.5,
        vy: 2.2 + Math.random() * 3.5,
        size: 5 + Math.random() * 5,
        color: ['#fbbf24', '#f43f5e', '#38bdf8', '#a855f7', '#34d399'][i % 5],
        alpha: 1,
        rot: Math.random() * 6,
        vrot: (Math.random() - 0.5) * 0.15
      });
    }
    if (!running) loop();
  }

  function loop() {
    running = true;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.14;
      p.rot += p.vrot;
      p.alpha -= 0.015;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
      ctx.restore();
    });
    particles = particles.filter(p => p.alpha > 0);
    if (particles.length > 0) requestAnimationFrame(loop);
    else running = false;
  }

  function flash(color = '#ffffff') {
    const el = document.getElementById('flash-overlay');
    el.style.backgroundColor = color;
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = 'flashPulse 0.35s ease-out forwards';
  }

  return { spawn, confetti, flash };
})();

/* ============================================================================
   3. CUSTOM SVG PORTRAIT GENERATOR (JIRO + ALL 15 CHARACTERS)
============================================================================ */
function renderPortraitSVG(charId, mood = 'normal', size = 150) {
  // Jiro: 40-year-old chubby man, full head of neat dark hair (not bald!), round friendly face, glasses, polo shirt + jacket
  if (charId === 'jiro') {
    const isHappy = mood === 'happy';
    const isSad = mood === 'sad';
    const isThink = mood === 'think';
    const mouthPath = isHappy
      ? 'M 64 95 Q 80 112 96 95 Z'
      : isSad
      ? 'M 66 104 Q 80 93 94 104'
      : isThink
      ? 'M 71 99 Q 80 97 89 101'
      : 'M 67 97 Q 80 106 93 97';
    const browOffset = isSad ? 4 : isThink ? -2 : 0;
    return `
    <svg viewBox="0 0 160 160" width="${size}" height="${size}" class="drop-shadow-lg overflow-visible">
      <defs>
        <linearGradient id="jiroShirt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="jiroJacket" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#334155"/>
          <stop offset="100%" stop-color="#1e293b"/>
        </linearGradient>
      </defs>
      <!-- Chubby Shoulders & Casual Jacket -->
      <path d="M 14 158 C 16 118, 42 110, 80 110 C 118 110, 144 118, 146 158 Z" fill="url(#jiroJacket)" stroke="#0f172a" stroke-width="2.5"/>
      <!-- Inner Polo Shirt -->
      <path d="M 54 112 L 80 156 L 106 112 Z" fill="url(#jiroShirt)"/>
      <path d="M 56 112 L 72 125 L 80 116 L 88 125 L 104 112" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
      <!-- Thick Neck & Double Chin hint -->
      <rect x="62" y="96" width="36" height="22" rx="10" fill="#fed7aa"/>
      <!-- Ears -->
      <circle cx="36" cy="76" r="9" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/>
      <circle cx="124" cy="76" r="9" fill="#fdba74" stroke="#9a3412" stroke-width="1.5"/>
      <!-- Round Chubby Head -->
      <ellipse cx="80" cy="74" rx="44" ry="42" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>
      <!-- Double Chin Curve -->
      <path d="M 60 107 Q 80 115 100 107" fill="none" stroke="#ea580c" stroke-width="1.8" opacity="0.65"/>
      <!-- Rosy Chubby Cheeks -->
      <ellipse cx="52" cy="84" rx="8" ry="5" fill="#fb7185" opacity="0.38"/>
      <ellipse cx="108" cy="84" rx="8" ry="5" fill="#fb7185" opacity="0.38"/>
      <!-- Full Head of Thick Neat Dark Hair (Definitely NOT bald!) -->
      <path d="M 34 72 C 30 34, 52 18, 80 18 C 108 18, 130 34, 126 72 C 123 54, 114 45, 102 43 C 94 49, 84 48, 76 42 C 64 49, 46 49, 34 72 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <!-- Sideburns & Top Hair Volume -->
      <path d="M 46 25 Q 68 12 96 20 Q 114 25 120 40" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Eyebrows -->
      <path d="M 52 ${60 + browOffset} Q 62 ${56 - browOffset} 71 ${60 + browOffset}" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 89 ${60 + browOffset} Q 98 ${56 - browOffset} 108 ${60 + browOffset}" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Glasses Frame -->
      <rect x="49" y="64" width="25" height="16" rx="4" fill="rgba(255,255,255,0.22)" stroke="#0f172a" stroke-width="2.4"/>
      <rect x="86" y="64" width="25" height="16" rx="4" fill="rgba(255,255,255,0.22)" stroke="#0f172a" stroke-width="2.4"/>
      <line x1="74" y1="71" x2="86" y2="71" stroke="#0f172a" stroke-width="2.4"/>
      <!-- Eyes -->
      ${isHappy
        ? '<path d="M 55 73 Q 61 67 68 73" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/><path d="M 92 73 Q 98 67 105 73" fill="none" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>'
        : '<circle cx="61.5" cy="72" r="3.4" fill="#0f172a"/><circle cx="98.5" cy="72" r="3.4" fill="#0f172a"/><circle cx="62.7" cy="70.8" r="1.1" fill="#fff"/><circle cx="99.7" cy="70.8" r="1.1" fill="#fff"/>'}
      <!-- Round Nose -->
      <path d="M 78 76 Q 75 84 82 85" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round"/>
      <!-- Mouth -->
      <path d="${mouthPath}" fill="${isHappy ? '#f43f5e' : 'none'}" stroke="#7c2d12" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Sweat Drop if Sad or Thinking -->
      ${(isSad || isThink) ? '<path d="M 122 50 C 122 50, 128 60, 125 65 C 123 68, 119 67, 119 63 C 119 59, 122 50, 122 50 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>' : ''}
    </svg>`;
  }

  // Heroine Portrait Configurations for all 15 characters
  const specs = {
    sakura:   { hair: '#92400e', hairHi: '#d97706', style: 'bob', eyes: '#16a34a', outfit: '#fbcfe8', trim: '#f43f5e', acc: 'wingClip', skin: '#ffedd5' },
    chino:    { hair: '#bae6fd', hairHi: '#e0f2fe', style: 'twintail', eyes: '#2563eb', outfit: '#1e293b', trim: '#ffffff', acc: 'xPin', skin: '#fff7ed' },
    haibara:  { hair: '#9a3412', hairHi: '#ea580c', style: 'wavyBob', eyes: '#0d9488', outfit: '#4c1d95', trim: '#ddd6fe', acc: 'coolBangs', skin: '#ffedd5' },
    mikoto:   { hair: '#78350f', hairHi: '#b45309', style: 'short', eyes: '#b45309', outfit: '#f8fafc', trim: '#1e3a8a', acc: 'flowerPin', skin: '#ffedd5' },
    madoka:   { hair: '#f472b6', hairHi: '#fbcfe8', style: 'twintailRibbon', eyes: '#db2777', outfit: '#fce7f3', trim: '#ec4899', acc: 'redRibbons', skin: '#fff1f2' },
    anna:     { hair: '#713f12', hairHi: '#a16207', style: 'longWavy', eyes: '#4338ca', outfit: '#1e293b', trim: '#38bdf8', acc: 'snack', skin: '#ffedd5' },
    marin:    { hair: '#fde047', hairHi: '#fef9c3', style: 'longGal', eyes: '#e11d48', outfit: '#f8fafc', trim: '#0284c7', acc: 'choker', skin: '#ffedd5' },
    eru:      { hair: '#1e1b4b', hairHi: '#4338ca', style: 'longStraight', eyes: '#7c3aed', outfit: '#1e293b', trim: '#94a3b8', acc: 'curiousSpark', skin: '#fff7ed' },
    mai:      { hair: '#0f172a', hairHi: '#334155', style: 'longSide', eyes: '#1d4ed8', outfit: '#1e293b', trim: '#e11d48', acc: 'bunnyPin', skin: '#fff7ed' },
    chizuru:  { hair: '#5c2d16', hairHi: '#854d0e', style: 'longLady', eyes: '#92400e', outfit: '#fecdd3', trim: '#be123c', acc: 'earring', skin: '#fff7ed' },
    tsubame:  { hair: '#854d0e', hairHi: '#ca8a04', style: 'semiLong', eyes: '#6d28d9', outfit: '#e0e7ff', trim: '#4f46e5', acc: 'beret', skin: '#fff7ed' },
    uzaki:    { hair: '#94a3b8', hairHi: '#cbd5e1', style: 'lowTwin', eyes: '#0284c7', outfit: '#ffffff', trim: '#ef4444', acc: 'fang', skin: '#ffedd5' },
    holo:     { hair: '#b45309', hairHi: '#f59e0b', style: 'longWolf', eyes: '#dc2626', outfit: '#fef3c7', trim: '#b91c1c', acc: 'wolfEars', skin: '#ffedd5' },
    tohru:    { hair: '#facc15', hairHi: '#fef08a', style: 'longDragon', eyes: '#ea580c', outfit: '#18181b', trim: '#ffffff', acc: 'dragonHorns', skin: '#ffedd5' },
    nagato:   { hair: '#312e81', hairHi: '#6366f1', style: 'shortBob', eyes: '#b45309', outfit: '#1e3a8a', trim: '#f8fafc', acc: 'glasses', skin: '#f8fafc' }
  };

  const s = specs[charId] || specs.sakura;
  const isBoss = ['haibara', 'anna', 'mai', 'uzaki', 'nagato'].includes(charId);
  const isAngry = mood === 'attack';
  const isShock = mood === 'damage';
  const isSmile = mood === 'happy';

  // Back hair layer
  let backHair = '';
  if (s.style.includes('twintail')) {
    backHair = `
      <path d="M 42 56 Q 16 82 24 134 Q 36 128 45 86 Z" fill="${s.hair}" stroke="#0f172a" stroke-width="1.6"/>
      <path d="M 118 56 Q 144 82 136 134 Q 124 128 115 86 Z" fill="${s.hair}" stroke="#0f172a" stroke-width="1.6"/>`;
  } else if (s.style === 'lowTwin') {
    backHair = `
      <path d="M 44 76 Q 22 98 28 132 Q 40 126 48 92 Z" fill="${s.hair}" stroke="#0f172a" stroke-width="1.6"/>
      <path d="M 116 76 Q 138 98 132 132 Q 120 126 112 92 Z" fill="${s.hair}" stroke="#0f172a" stroke-width="1.6"/>`;
  } else if (s.style.includes('long')) {
    backHair = `<path d="M 38 52 C 26 92, 28 136, 36 156 L 124 156 C 132 136, 134 92, 122 52 Z" fill="${s.hair}" stroke="#0f172a" stroke-width="1.8"/>`;
  } else {
    backHair = `<path d="M 40 50 C 32 76, 34 102, 44 108 L 116 108 C 126 102, 128 76, 120 50 Z" fill="${s.hair}" stroke="#0f172a" stroke-width="1.6"/>`;
  }

  // Special non-human / unique accessories
  let extraBack = '';
  let extraFront = '';
  if (s.acc === 'wolfEars') {
    extraBack += `
      <polygon points="44,44 34,10 64,34" fill="#b45309" stroke="#0f172a" stroke-width="1.8"/>
      <polygon points="46,39 39,18 59,34" fill="#fef3c7"/>
      <polygon points="116,44 126,10 96,34" fill="#b45309" stroke="#0f172a" stroke-width="1.8"/>
      <polygon points="114,39 121,18 101,34" fill="#fef3c7"/>
      <path d="M 115 140 Q 152 118 146 86 Q 130 98 118 124 Z" fill="#d97706" stroke="#0f172a" stroke-width="1.8"/>`;
  }
  if (s.acc === 'dragonHorns') {

  function drawRandomQuestions(themeId, count = 5) {
    const pool = [...QUIZ_BANK[themeId]];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, count).map(q => {
      const choicesWithFlag = [0, 1, 2, 3].map(idx => ({
        text: q[idx + 1],
        isCorrect: idx === q[5]
      }));
      for (let i = choicesWithFlag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [choicesWithFlag[i], choicesWithFlag[j]] = [choicesWithFlag[j], choicesWithFlag[i]];
      }
      const newCorrectIdx = choicesWithFlag.findIndex(c => c.isCorrect);
      return [
        q[0],
        choicesWithFlag[0].text,
        choicesWithFlag[1].text,
        choicesWithFlag[2].text,
        choicesWithFlag[3].text,
        newCorrectIdx,
        q[6]
      ];
    });
  }

          </div>
        </div>

        <!-- Character VS Strip -->
        <div class="flex items-center justify-between px-2 my-1 bg-slate-900/60 border border-slate-700/70 rounded-2xl py-1">
          <div class="flex items-center gap-1.5">
            <div id="jiro-battle-sprite">${renderPortraitSVG('jiro', 'think', 68)}</div>
            <div class="text-[11px]">
              <div class="font-black text-sky-300">次郎 (40)</div>
              <div id="jiro-emote" class="text-slate-300">むむっ、どれだ…？</div>
            </div>
          </div>
          <div class="text-xs font-black text-amber-400">VS</div>
          <div class="flex items-center gap-1.5 text-right">
            <div class="text-[11px]">
              <div class="font-black ${char.isBoss ? 'text-rose-300' : 'text-pink-300'}">${char.name}</div>
              <div id="opp-emote" class="text-slate-300">${char.role}</div>
            </div>
            <div id="opp-battle-sprite" class="${char.isBoss ? 'anim-boss' : ''}">${renderPortraitSVG(char.id, 'normal', 68)}</div>
          </div>
        </div>

        <!-- Question Card -->
        <div class="bg-slate-900/95 border-2 border-indigo-400/60 rounded-2xl p-3 shadow-lg my-1">
          <div class="text-[10px] font-bold text-indigo-300 mb-1">Q${qIndex + 1}. ${activeDungeon.short}</div>
          <p class="text-xs sm:text-sm font-extrabold text-white leading-relaxed">${q[0]}</p>
        </div>

        <!-- 4 Choices -->
        <div class="flex flex-col gap-1.5 my-1">
          ${choicesHtml}
        </div>

        <!-- Feedback Banner (Hidden until answered) -->
        <div id="answer-feedback" class="hidden rounded-xl p-2.5 text-xs font-bold border"></div>
      </div>
    `;

    timerInterval = setInterval(() => {
      if (answered) return;
      timerVal = Math.max(0, timerVal - 0.1);
      const bar = document.getElementById('timer-bar');
      if (bar) bar.style.width = `${(timerVal / 15.0) * 100}%`;
      if (timerVal <= 3.0 && Math.abs(timerVal - Math.round(timerVal)) < 0.06) {
        AudioSys.se('tick');
      }
      if (timerVal <= 0) {
        submitAnswer(-1); // Time up!
      }
    }, 100);
  }

  function submitAnswer(chosenIdx) {
    if (answered) return;
    answered = true;
    clearBattleTimer();

    const q = battleQuestions[qIndex];
    const correctIdx = q[5];
    const isCorrect = chosenIdx === correctIdx;
    const char = activeDungeon.chars[stageIdx];

    // Disable all buttons and highlight correct/wrong
    for (let i = 0; i < 4; i++) {
      const btn = document.getElementById(`choice-${i}`);
      if (!btn) continue;
      btn.disabled = true;
      if (i === correctIdx) {
        btn.classList.remove('bg-slate-800/95', 'border-slate-600');
        btn.classList.add('bg-emerald-700', 'border-emerald-300');
      } else if (i === chosenIdx && !isCorrect) {
        btn.classList.remove('bg-slate-800/95', 'border-slate-600');
        btn.classList.add('bg-rose-800', 'border-rose-400');
      } else {
        btn.classList.add('opacity-50');
      }
    }

    const fb = document.getElementById('answer-feedback');
    const jiroSprite = document.getElementById('jiro-battle-sprite');
    const oppSprite = document.getElementById('opp-battle-sprite');
    const jiroEmote = document.getElementById('jiro-emote');
    const oppEmote = document.getElementById('opp-emote');

    if (isCorrect) {
      correctCount++;
      state.totalCorrect++;
      AudioSys.se('correct');
      FX.flash('#4ade80');
      const rect = container.getBoundingClientRect();
      FX.spawn(rect.width / 2, rect.height * 0.45, 30);

      if (jiroSprite) jiroSprite.innerHTML = renderPortraitSVG('jiro', 'happy', 68);
      if (oppSprite) oppSprite.innerHTML = renderPortraitSVG(char.id, 'damage', 68);
      if (jiroEmote) jiroEmote.textContent = 'よっしゃあ！大正解！';
      if (oppEmote) oppEmote.textContent = 'きゃっ、当てられた！';

      fb.className = 'rounded-xl p-2.5 text-xs font-bold border bg-emerald-950/90 border-emerald-400 text-emerald-100 anim-pop';
      fb.innerHTML = `<div class="text-emerald-300 font-black mb-0.5">⭕ 正解！ (${correctCount}問目クリア)</div><div class="text-[11px] font-normal text-slate-200">${q[6]}</div>`;
    } else {
      AudioSys.se('wrong');
      FX.flash('#f43f5e');
      const root = document.getElementById('battle-root');
      if (root) {
        root.classList.remove('anim-shake');
        void root.offsetWidth;
        root.classList.add('anim-shake');
      }
      if (jiroSprite) jiroSprite.innerHTML = renderPortraitSVG('jiro', 'sad', 68);
      if (oppSprite) oppSprite.innerHTML = renderPortraitSVG(char.id, 'happy', 68);
      if (jiroEmote) jiroEmote.textContent = chosenIdx === -1 ? 'うわっ、時間切れ…！' : 'しまった、外した…！';
      if (oppEmote) oppEmote.textContent = 'ふふっ、残念だったわね！';

      fb.className = 'rounded-xl p-2.5 text-xs font-bold border bg-rose-950/90 border-rose-400 text-rose-100 anim-pop';
      fb.innerHTML = `<div class="text-rose-300 font-black mb-0.5">${chosenIdx === -1 ? '⏰ 時間切れ！' : '❌ 不正解…'} 正解は「${q[correctIdx + 1]}」</div><div class="text-[11px] font-normal text-slate-200">${q[6]}</div>`;
    }

    setTimeout(() => {
      qIndex++;
      if (qIndex < 5) {
        renderQuestion();
      } else {
        finishQuizBattle();
      }
    }, 1850);
  }

  function finishQuizBattle() {
    const char = activeDungeon.chars[stageIdx];
    const won = correctCount >= 3;

    if (won) {
      state.totalWins++;
      writeSave();
      AudioSys.se('victory');
      FX.confetti();

      const lines = [
        {
          speaker: '次郎（40歳）',
          jiroMood: 'happy',
          opp: char.id,
          oppMood: 'damage',
          oppLabel: char.name,
          isBoss: char.isBoss,
          text: `「やったぜ！5問中${correctCount}問正解！俺の勝利だ！」`
        },
        {
          speaker: char.name,
          jiroMood: 'happy',
          opp: char.id,
          oppMood: 'happy',
          oppLabel: char.name,
          isBoss: char.isBoss,
          text: char.win[0]
        },
        {
          speaker: char.name,
          jiroMood: 'normal',
          opp: char.id,
          oppMood: 'happy',
          oppLabel: char.name,
          isBoss: char.isBoss,
          text: char.win[1]
        }
      ];

      startAdv(lines, () => {
        if (stageIdx < 2) {
          stageIdx++;
          startStagePreAdv();
        } else {
          // Dungeon Cleared!
          handleDungeonClear();
        }
      });
    } else {
      // Defeated -> ADV -> Kicked out to Dungeon Select Hub!
      AudioSys.se('defeat');
      const lines = [
        {
          speaker: '次郎（40歳）',
          jiroMood: 'sad',
          opp: char.id,
          oppMood: 'happy',
          oppLabel: char.name,
          isBoss: char.isBoss,
          text: `「くそっ、${correctCount}問しか正解できなかった……！3問正解に届かず敗北か……！」`
        },
        {
          speaker: char.name,
          jiroMood: 'sad',
          opp: char.id,
          oppMood: 'happy',
          oppLabel: char.name,
          isBoss: char.isBoss,
          text: char.lose[0]
        },
        {
          speaker: char.name,
          jiroMood: 'sad',
          opp: char.id,
          oppMood: 'normal',
          oppLabel: char.name,
          isBoss: char.isBoss,
          text: char.lose[1]
        },
        {
          speaker: 'システム',
          jiroMood: 'sad',
          opp: null,
          text: `次郎は${activeDungeon.name}の外へ弾き出されてしまった……！ダンジョン選択からやり直そう！`
        }
      ];
      startAdv(lines, () => {
        renderHub();
      });
    }
  }

  function handleDungeonClear() {
    state.cleared[activeDungeon.id] = true;
    writeSave();
    AudioSys.se('victory');
    FX.confetti();

    const clearLines = activeDungeon.clearAdv.map((t, i) => ({
      speaker: i === 1 ? '次郎（40歳）' : 'ダンジョン制覇！',
      jiroMood: 'happy',
      opp: null,
      text: t
    }));

    startAdv(clearLines, () => {
      const allCleared = Object.values(state.cleared).every(Boolean);
      if (allCleared && !state.seenAllClear) {
        state.seenAllClear = true;
        writeSave();
        playAllClearAdv();
      } else {
        renderHub();
      }
    });
  }

  function playAllClearAdv() {
    AudioSys.se('victory');
    FX.confetti();
    const lines = [
      { speaker: 'ナレーション', jiroMood: 'happy', opp: null, text: 'ついに次郎は、5つのクイズダンジョンすべてを完全制覇した！' },
      { speaker: '女子小・中・高生代表', jiroMood: 'happy', opp: 'mai', oppMood: 'happy', oppLabel: 'ダンジョンヒロインズ', text: '「40歳のおじさんなのに、私たちの流行や悩みまで本当に理解してくれるなんて見直したわ！」' },
      { speaker: 'AI＆画像生成代表', jiroMood: 'happy', opp: 'nagato', oppMood: 'happy', oppLabel: 'AIマスターズ', text: '「……2026年の最新AI知識と生成技術も完璧に習得完了。あなたの知的好奇心に敬意を表する。」' },
      { speaker: '次郎（40歳）', jiroMood: 'happy', opp: null, text: '「はっはっは！年齢なんて関係ない、学びと好奇心があれば人生いつでも青春だぜ！ありがとうみんなー！」' },
      { speaker: '祝・全ダンジョン制覇！', jiroMood: 'happy', opp: null, text: '『次郎の5大クイズダンジョン』完全クリアおめでとう！これからも好きなダンジョンで何度でも遊べるぞ！' }
    ];
    startAdv(lines, () => {
      FX.confetti();
      renderHub();
    });
  }

  /* ---------------------- PC KEYBOARD CONTROLS ---------------------- */
  document.addEventListener('keydown', (e) => {
    const modalOpen = !document.getElementById('modal-overlay').classList.contains('hidden');
    if (modalOpen) {
      if (e.key === 'Escape') hideModal();
      return;
    }

    const k = e.key.toLowerCase();
    if (k === 'm') {
      AudioSys.toggleMute();
      return;
    }

    if (screen === 'title') {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startFromTitle();
      } else if (k === 'o') {
        playOpeningAdv();
      } else if (e.key === 'Delete') {
        confirmDeleteSave();
      }
    } else if (screen === 'hub') {
      if (['1', '2', '3', '4', '5'].includes(e.key)) {
        selectDungeon(parseInt(e.key, 10) - 1);
      } else if (k === 'e' && Object.values(state.cleared).every(Boolean)) {
        playAllClearAdv();
      } else if (e.key === 'Escape') {
        renderTitle();
      }
    } else if (screen === 'adv') {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        advanceAdv();
      } else if (k === 's') {
        skipAdv();
      } else if (e.key === 'Escape') {
        confirmReturnHub();
      }
    } else if (screen === 'battle') {
      if (['1', '2', '3', '4'].includes(e.key)) {
        submitAnswer(parseInt(e.key, 10) - 1);
      } else if (['a', 'b', 'c', 'd'].includes(k)) {
        submitAnswer(['a', 'b', 'c', 'd'].indexOf(k));
      } else if (e.key === 'Escape') {
        confirmReturnHub();
      }
    }
  });

  function init() {
    loadSave();
    renderTitle();
  }

  return {
    init,
    renderTitle,
    renderHub,
    startFromTitle,
    playOpeningAdv,
    playAllClearAdv,
    selectDungeon,
    advanceAdv,
    skipAdv,
    submitAnswer,
    confirmDeleteSave,
    confirmReturnHub
  };
})();

window.onload = () => Game.init();
</script>
</body>
</html>
